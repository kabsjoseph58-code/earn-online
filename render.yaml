services:
  - type: web
    name: earn-online
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        value: https://earn-online.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: earn-online-db
          property: connectionString

databases:
  - name: earn-online-db
    databaseName: earn_online
    user: ute_admin
    plan: free
